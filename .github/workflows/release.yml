name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Validate canonical release tag
        id: release-version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne 'tag') {
            throw "Release workflow requires a tag ref, got '$($env:RELEASE_REF_TYPE)'."
          }

          $match = [regex]::Match($env:RELEASE_TAG, '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$')
          if (-not $match.Success) {
            throw "Malformed release tag '$($env:RELEASE_TAG)'. Expected vX.Y.Z."
          }

          $version = $match.Groups['version'].Value
          if ($version -ne '0.1.0') {
            throw "Unsupported first-release version '$version'; expected 0.1.0."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  platform:
    name: Platform / ${{ matrix.os }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Verify telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') {
            throw 'KEELMATRIX_NO_TELEMETRY must be set to 1 for release validation.'
          }

      - name: Restore from repository NuGet.config
        run: dotnet restore KeelMatrix.BehaviorOracle.sln --configfile NuGet.config --no-cache --force -p:NuGetAudit=false

      - name: Build Release with warnings as errors
        run: >
          dotnet build KeelMatrix.BehaviorOracle.sln
          --configuration Release
          --no-restore
          --warnaserror
          -p:Version=${{ needs.resolve-version.outputs.version }}
          -p:PackageVersion=${{ needs.resolve-version.outputs.version }}
          -p:SourceRevisionId=${{ github.sha }}
          -p:RepositoryCommit=${{ github.sha }}

      - name: Run full test suite
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'behaviororacle-release-test-results'
          New-Item -ItemType Directory -Path $resultsDirectory -Force | Out-Null
          dotnet test KeelMatrix.BehaviorOracle.sln --configuration Release --no-build --no-restore --results-directory $resultsDirectory --logger 'trx;LogFileName=behaviororacle-release.trx'
          if ($LASTEXITCODE -ne 0) {
            throw "The full test suite failed with exit code $LASTEXITCODE."
          }

          $trxPath = Get-ChildItem -LiteralPath $resultsDirectory -Filter '*.trx' -File | Select-Object -First 1
          if ($null -eq $trxPath) {
            throw 'The full test suite did not produce a TRX result file.'
          }

          [xml]$trx = Get-Content -LiteralPath $trxPath.FullName -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if ([int]$counters.total -eq 0 -or
              [int]$counters.failed -ne 0 -or
              [int]$counters.errors -ne 0 -or
              [int]$counters.notExecuted -ne 0) {
            throw "The test suite was not fully successful: total=$($counters.total), passed=$($counters.passed), failed=$($counters.failed), errors=$($counters.errors), notExecuted=$($counters.notExecuted)."
          }

          $testNames = @($trx.TestRun.Results.UnitTestResult | ForEach-Object { $_.testName })
          $workerTests = @($testNames | Where-Object { $_ -match 'WorkerProcessTests' })
          if ($workerTests.Count -lt 7) {
            throw "Expected worker/process evidence in the full suite, found $($workerTests.Count) tests."
          }

      - name: Verify formatting and analyzers
        run: dotnet format KeelMatrix.BehaviorOracle.sln --verify-no-changes --no-restore

      - name: Run deterministic synthetic benchmark gate
        shell: pwsh
        run: |
          $benchmarkScript = [IO.Path]::Combine($PWD.Path, 'bench', 'Run-Benchmark.ps1')
          $PSNativeCommandUseErrorActionPreference = $false
          & pwsh -NoProfile -File $benchmarkScript -Seed 12345 -ScenarioBudget 80 -ConfirmationRuns 3
          $benchmarkExitCode = $LASTEXITCODE
          if ($benchmarkExitCode -ne 1) {
            throw "The synthetic benchmark must report its planted divergence with exit code 1, got $benchmarkExitCode."
          }

          $reportPath = [IO.Path]::Combine($PWD.Path, 'bench', 'results', 'synthetic-benchmark.json')
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "The synthetic benchmark report was not produced: $reportPath"
          }

          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.resultState -ne 'BEHAVIORAL_DIVERGENCE' -or
              $report.seed -ne 12345 -or
              $report.scenarioBudget -ne 80 -or
              $report.confirmationRuns -ne 3 -or
              $report.generatedScenarios -ne 80 -or
              $report.divergenceCount -ne 35 -or
              -not $report.trustworthy) {
            throw 'The synthetic benchmark report did not match the validated deterministic outcome.'
          }

          $metrics = $report.benchmark
          if ($metrics.plantedDivergences -ne 35 -or
              $metrics.trueDetectedDivergences -ne 35 -or
              $metrics.falseDivergences -ne 0 -or
              $metrics.precision -ne 1 -or
              $metrics.recall -ne 1 -or
              $metrics.scenarioOutcomeMismatches -ne 0) {
            throw "Unexpected synthetic benchmark metrics: $($metrics | ConvertTo-Json -Compress)."
          }

      - name: Audit vulnerable dependencies (required, fail closed)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-DependencyAudit.ps1 -Mode Required -Solution KeelMatrix.BehaviorOracle.sln

  package:
    name: Package / inspect and consume
    needs:
      - resolve-version
      - platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.424

      - name: Verify telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') {
            throw 'KEELMATRIX_NO_TELEMETRY must be set to 1 for release validation.'
          }

      - name: Restore from repository NuGet.config
        run: dotnet restore KeelMatrix.BehaviorOracle.sln --configfile NuGet.config --no-cache --force -p:NuGetAudit=false

      - name: Build Release with the validated version
        run: >
          dotnet build KeelMatrix.BehaviorOracle.sln
          --configuration Release
          --no-restore
          --warnaserror
          -p:Version=${{ needs.resolve-version.outputs.version }}
          -p:PackageVersion=${{ needs.resolve-version.outputs.version }}

      - name: Pack the exact package and symbols
        run: >
          dotnet pack src/KeelMatrix.BehaviorOracle/KeelMatrix.BehaviorOracle.csproj
          --configuration Release
          --no-build
          --no-restore
          --include-symbols
          -p:SymbolPackageFormat=snupkg
          -p:Version=${{ needs.resolve-version.outputs.version }}
          -p:PackageVersion=${{ needs.resolve-version.outputs.version }}
          -p:SourceRevisionId=${{ github.sha }}
          -p:RepositoryCommit=${{ github.sha }}
          --output ./artifacts/packages

      - name: Inspect package contents and exact artifact set
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/Verify-PackageContract.ps1
          -PackagePath ./artifacts/packages/KeelMatrix.BehaviorOracle.${{ needs.resolve-version.outputs.version }}.nupkg
          -SymbolsPath ./artifacts/packages/KeelMatrix.BehaviorOracle.${{ needs.resolve-version.outputs.version }}.snupkg
          -ExpectedVersion $env:RELEASE_VERSION
          -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Validate isolated package consumer
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/Invoke-PackageSmoke.ps1
          -PackagePath ./artifacts/packages/KeelMatrix.BehaviorOracle.${{ needs.resolve-version.outputs.version }}.nupkg
          -SymbolsPath ./artifacts/packages/KeelMatrix.BehaviorOracle.${{ needs.resolve-version.outputs.version }}.snupkg
          -ExpectedRepositoryCommit $env:GITHUB_SHA
          -Seed 12345
          -ScenarioBudget 20
          -ConfirmationRuns 2

      - name: Upload inspected packages
        uses: actions/upload-artifact@v7
        with:
          name: behaviororacle-release-packages
          if-no-files-found: error
          path: ./artifacts/packages/*
          retention-days: 7

  publish:
    name: Publish exact package set
    needs:
      - resolve-version
      - platform
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      KEELMATRIX_NO_TELEMETRY: "1"
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Download inspected packages
        uses: actions/download-artifact@v7
        with:
          name: behaviororacle-release-packages
          path: ./artifacts/packages

      - name: Verify telemetry remains disabled
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') {
            throw 'KEELMATRIX_NO_TELEMETRY must be set to 1 for publication.'
          }

      - name: Reassert exact publication artifact set
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $packageDirectory = [IO.Path]::Combine($PWD.Path, 'artifacts', 'packages')
          $expected = @(
            "KeelMatrix.BehaviorOracle.$version.nupkg",
            "KeelMatrix.BehaviorOracle.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $packageDirectory -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) {
            throw "Refusing publication. Expected exactly: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push exact package
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $packageDirectory = [IO.Path]::Combine($PWD.Path, 'artifacts', 'packages')
          $source = 'https://api.nuget.org/v3/index.json'
          dotnet nuget push (Join-Path $packageDirectory "KeelMatrix.BehaviorOracle.$version.nupkg") --source $source --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet package publication failed with exit code $LASTEXITCODE."
          }

          dotnet nuget push (Join-Path $packageDirectory "KeelMatrix.BehaviorOracle.$version.snupkg") --source $source --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet symbol publication failed with exit code $LASTEXITCODE."
          }

      - name: Create GitHub release after successful publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --title $env:RELEASE_TAG --generate-notes `
            (Join-Path $PWD.Path "artifacts/packages/KeelMatrix.BehaviorOracle.$($env:RELEASE_VERSION).nupkg") `
            (Join-Path $PWD.Path "artifacts/packages/KeelMatrix.BehaviorOracle.$($env:RELEASE_VERSION).snupkg")
