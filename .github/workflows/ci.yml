name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

jobs:
  platform:
    name: Platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') {
            throw 'KEELMATRIX_NO_TELEMETRY must be set to 1 for CI.'
          }

      - name: Snapshot telemetry state
        shell: pwsh
        run: |
          function Get-TelemetryFiles {
            $bases = @(
              [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile),
              [IO.Path]::GetTempPath()
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

            $roots = foreach ($base in $bases) {
              [IO.Path]::Combine($base, 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, '.local', 'share', 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, 'AppData', 'Local', 'KeelMatrix', 'BehaviorOracle')
            }

            foreach ($root in $roots | Select-Object -Unique) {
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Recurse -Force -File -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
              }
            }
          }

          @(Get-TelemetryFiles) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'behaviororacle-telemetry-before.txt') -Encoding utf8

      - name: Restore
        run: dotnet restore KeelMatrix.BehaviorOracle.sln --configfile NuGet.config -p:NuGetAudit=false

      - name: Build Release with warnings as errors
        run: dotnet build KeelMatrix.BehaviorOracle.sln --configuration Release --no-restore --warnaserror

      - name: Verify formatting with restore
        run: dotnet format KeelMatrix.BehaviorOracle.sln --verify-no-changes

      - name: Run full test suite and assert worker coverage
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'behaviororacle-test-results'
          New-Item -ItemType Directory -Path $resultsDirectory -Force | Out-Null
          dotnet test KeelMatrix.BehaviorOracle.sln --configuration Release --no-build --no-restore --results-directory $resultsDirectory --logger 'trx;LogFileName=behaviororacle.trx'
          if ($LASTEXITCODE -ne 0) {
            throw "The BehaviorOracle test suite failed with exit code $LASTEXITCODE."
          }

          $trxPath = Get-ChildItem -LiteralPath $resultsDirectory -Filter '*.trx' -File | Select-Object -First 1
          if ($null -eq $trxPath) {
            throw 'The test suite did not produce a TRX result file.'
          }

          [xml]$trx = Get-Content -LiteralPath $trxPath.FullName -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if ([int]$counters.total -ne 42 -or
              [int]$counters.passed -ne 42 -or
              [int]$counters.failed -ne 0 -or
              [int]$counters.errors -ne 0 -or
              [int]$counters.notExecuted -ne 0) {
            throw "Expected 42 passing tests, got total=$($counters.total), passed=$($counters.passed), failed=$($counters.failed), errors=$($counters.errors), notExecuted=$($counters.notExecuted)."
          }

          $testNames = @($trx.TestRun.Results.UnitTestResult | ForEach-Object { $_.testName })
          $workerTests = @($testNames | Where-Object { $_ -match 'WorkerProcessTests' })
          if ($workerTests.Count -lt 7) {
            throw "Expected worker/process tests in the full suite, found $($workerTests.Count)."
          }

      - name: Run deterministic synthetic benchmark
        shell: pwsh
        run: |
          $benchmarkScript = [IO.Path]::Combine($PWD.Path, 'bench', 'Run-Benchmark.ps1')
          $PSNativeCommandUseErrorActionPreference = $false
          & pwsh -NoProfile -File $benchmarkScript -Seed 12345 -ScenarioBudget 80 -ConfirmationRuns 3
          $benchmarkExitCode = $LASTEXITCODE
          if ($benchmarkExitCode -ne 1) {
            throw "The synthetic benchmark must report the planted divergence with exit code 1, got $benchmarkExitCode."
          }

          $reportPath = [IO.Path]::Combine($PWD.Path, 'bench', 'results', 'synthetic-benchmark.json')
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "The synthetic benchmark report was not produced: $reportPath"
          }

          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.resultState -ne 'BEHAVIORAL_DIVERGENCE' -or
              $report.seed -ne 12345 -or
              $report.scenarioBudget -ne 80 -or
              $report.confirmationRuns -ne 3 -or
              $report.generatedScenarios -ne 80 -or
              $report.divergenceCount -ne 35 -or
              -not $report.trustworthy) {
            throw 'The synthetic benchmark report did not match the committed deterministic outcome.'
          }

          $metrics = $report.benchmark
          if ($metrics.plantedDivergences -ne 35 -or
              $metrics.trueDetectedDivergences -ne 35 -or
              $metrics.falseDivergences -ne 0 -or
              $metrics.precision -ne 1 -or
              $metrics.recall -ne 1 -or
              $metrics.scenarioOutcomeMismatches -ne 0) {
            throw "Unexpected synthetic benchmark metrics: $($metrics | ConvertTo-Json -Compress)."
          }

          exit 0

      - name: Validate committed GitHub Action wrapper
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: pwsh -NoProfile -File action/Test-Action.ps1

      - name: Check vulnerable dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-DependencyAudit.ps1 -Mode Ci -Solution KeelMatrix.BehaviorOracle.sln

      - name: Verify telemetry remained suppressed
        shell: pwsh
        run: |
          function Get-TelemetryFiles {
            $bases = @(
              [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile),
              [IO.Path]::GetTempPath()
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

            $roots = foreach ($base in $bases) {
              [IO.Path]::Combine($base, 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, '.local', 'share', 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, 'AppData', 'Local', 'KeelMatrix', 'BehaviorOracle')
            }

            foreach ($root in $roots | Select-Object -Unique) {
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Recurse -Force -File -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
              }
            }
          }

          $beforePath = Join-Path $env:RUNNER_TEMP 'behaviororacle-telemetry-before.txt'
          $before = @(Get-Content -LiteralPath $beforePath -ErrorAction SilentlyContinue)
          $after = @(Get-TelemetryFiles)
          $newFiles = @($after | Where-Object { $before -notcontains $_ })
          if ($newFiles.Count -gt 0) {
            throw "Telemetry state changed during CI: $($newFiles -join ', ')."
          }

  dependency-audit-required:
    name: Required dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependency graph for explicit audit
        run: dotnet restore KeelMatrix.BehaviorOracle.sln --configfile NuGet.config -p:NuGetAudit=false

      - name: Run required fail-closed dependency audit
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-DependencyAudit.ps1 -Mode Required -Solution KeelMatrix.BehaviorOracle.sln

      - name: Demonstrate unavailable-advisory distinction
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Test-DependencyAudit.ps1

  package:
    name: Package / inspect and consume
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne '1') {
            throw 'KEELMATRIX_NO_TELEMETRY must be set to 1 for CI.'
          }

      - name: Snapshot telemetry state
        shell: pwsh
        run: |
          function Get-TelemetryFiles {
            $bases = @(
              [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile),
              [IO.Path]::GetTempPath()
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

            $roots = foreach ($base in $bases) {
              [IO.Path]::Combine($base, 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, '.local', 'share', 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, 'AppData', 'Local', 'KeelMatrix', 'BehaviorOracle')
            }

            foreach ($root in $roots | Select-Object -Unique) {
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Recurse -Force -File -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
              }
            }
          }

          @(Get-TelemetryFiles) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'behaviororacle-package-telemetry-before.txt') -Encoding utf8

      - name: Restore
        run: dotnet restore KeelMatrix.BehaviorOracle.sln --configfile NuGet.config -p:NuGetAudit=false

      - name: Build Release with warnings as errors
        run: dotnet build KeelMatrix.BehaviorOracle.sln --configuration Release --no-restore --warnaserror

      - name: Pack the intended package and symbols
        run: >
          dotnet pack src/KeelMatrix.BehaviorOracle/KeelMatrix.BehaviorOracle.csproj
          --configuration Release
          --no-build
          --no-restore
          --include-symbols
          --p:SymbolPackageFormat=snupkg
          --p:SourceRevisionId=${{ github.sha }}
          --p:RepositoryCommit=${{ github.sha }}
          --output ./artifacts/packages

      - name: Inspect exact package and symbol contracts
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/Verify-PackageContract.ps1
          -PackagePath ./artifacts/packages/KeelMatrix.BehaviorOracle.0.1.0.nupkg
          -SymbolsPath ./artifacts/packages/KeelMatrix.BehaviorOracle.0.1.0.snupkg
          -ExpectedRepositoryCommit $env:GITHUB_SHA
      - name: Install and smoke-test the packed tool
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/Invoke-PackageSmoke.ps1
          -PackagePath ./artifacts/packages/KeelMatrix.BehaviorOracle.0.1.0.nupkg
          -SymbolsPath ./artifacts/packages/KeelMatrix.BehaviorOracle.0.1.0.snupkg
          -ExpectedRepositoryCommit $env:GITHUB_SHA
          -Seed 12345
          -ScenarioBudget 20
          -ConfirmationRuns 2

      - name: Verify no telemetry activation was emitted
        shell: pwsh
        run: |
          function Get-TelemetryFiles {
            $bases = @(
              [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile),
              [IO.Path]::GetTempPath()
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

            $roots = foreach ($base in $bases) {
              [IO.Path]::Combine($base, 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, '.local', 'share', 'KeelMatrix', 'BehaviorOracle')
              [IO.Path]::Combine($base, 'AppData', 'Local', 'KeelMatrix', 'BehaviorOracle')
            }

            foreach ($root in $roots | Select-Object -Unique) {
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Recurse -Force -File -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
              }
            }
          }

          $beforePath = Join-Path $env:RUNNER_TEMP 'behaviororacle-package-telemetry-before.txt'
          $before = @(Get-Content -LiteralPath $beforePath -ErrorAction SilentlyContinue)
          $after = @(Get-TelemetryFiles)
          $newFiles = @($after | Where-Object { $before -notcontains $_ })
          if ($newFiles.Count -gt 0) {
            throw "Telemetry state changed during package smoke: $($newFiles -join ', ')."
          }
